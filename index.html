<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="温泉・遊園地・道の駅・観光地・駅に行くと、都道府県と地域メッシュが塗られていく旅の記録アプリ（試作）">
</head>
<body>
<title>ぬりたび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 上に進捗バー、左に塗れる地図、右（スマホでは下）に県・スポットの台帳 */
:root {
  --bg: #F1F4F3; --panel: #FFFFFF; --ink: #1C2A30; --muted: #5B6B71; --line: #D5DDDE;
  --sea: #DCE7EB; --land: #FAFBF8; --land-dim: #E9EEEC; --border: #A3B3B8;
  --lv1: #CFE1F2; --lv2: #8CB6E2; --lv3: #3E7BC2; --lv4: #E0AE2E; --target: #E4ECF6;
  --accent: #2F5FAE; --on-accent: #FFFFFF; --marker-ink: #FFFFFF;
  --c-onsen: #D4553A; --c-park: #8656C9; --c-michi: #2E8F5A; --c-sight: #B27606; --c-eki: #137C8C; --c-bus: #6A7A22;
  --font-d: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-b: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-m: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F171B; --panel: #162227; --ink: #E4ECEE; --muted: #93A4AA; --line: #2A3A41;
  --sea: #122128; --land: #26363E; --land-dim: #1B2930; --border: #4D616A;
  --lv1: #25445F; --lv2: #2F6AA8; --lv3: #5E9EE8; --lv4: #E7BB46; --target: #2A3B4E;
  --accent: #7FA8EC; --on-accent: #0F171B; --marker-ink: #0F171B;
  --c-onsen: #F07A5E; --c-park: #AE86EE; --c-michi: #55BE84; --c-sight: #E0A632; --c-eki: #3DB3C4; --c-bus: #A6B84A;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F171B; --panel: #162227; --ink: #E4ECEE; --muted: #93A4AA; --line: #2A3A41;
  --sea: #122128; --land: #26363E; --land-dim: #1B2930; --border: #4D616A;
  --lv1: #25445F; --lv2: #2F6AA8; --lv3: #5E9EE8; --lv4: #E7BB46; --target: #2A3B4E;
  --accent: #7FA8EC; --on-accent: #0F171B; --marker-ink: #0F171B;
  --c-onsen: #F07A5E; --c-park: #AE86EE; --c-michi: #55BE84; --c-sight: #E0A632; --c-eki: #3DB3C4; --c-bus: #A6B84A;
  color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 14px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }

/* ---- header ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--font-d); font-size: 24px; letter-spacing: .04em; color: var(--accent); }
.tagline { color: var(--muted); font-size: 12px; }
.stats { display: flex; gap: 22px; margin-left: auto; flex-wrap: wrap; }
.stat { display: grid; grid-template-columns: auto auto; align-items: baseline; column-gap: 2px; }
.stat b { font-family: var(--font-d); font-weight: 400; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stat small { grid-column: 1 / -1; color: var(--muted); font-size: 11px; letter-spacing: .08em; }

.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip .mk { width: 20px; height: 20px; font-size: 11px; }
.demo { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; color: var(--muted); }
.demo button { border: 1px solid var(--border); background: transparent; border-radius: 6px; padding: 2px 10px; font-size: 12px; }

.mk { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; color: var(--marker-ink); background: var(--c); }
.mk.off { background: transparent; color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.cat-onsen { --c: var(--c-onsen); } .cat-park { --c: var(--c-park); } .cat-michi { --c: var(--c-michi); }
.cat-sight { --c: var(--c-sight); } .cat-eki { --c: var(--c-eki); } .cat-bus { --c: var(--c-bus); }

/* ---- main ---- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; background: var(--sea); overflow: hidden; }
#map { display: block; width: 100%; height: 100%; touch-action: none; }
.panel { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 22px; }

.maptools { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.backbtn { position: absolute; top: 12px; left: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: var(--muted); max-width: calc(100% - 24px); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--border); }
.attr { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: var(--muted); background: color-mix(in srgb, var(--panel) 75%, transparent); padding: 1px 6px; border-radius: 4px; }
.attr a { color: inherit; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); max-width: 240px; z-index: 3; }
.tip b { display: block; font-size: 13px; }
.spotcard { position: absolute; left: 12px; right: 12px; bottom: 12px; margin-inline: auto; max-width: 420px; display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 28px rgb(0 0 0 / .18); z-index: 4; }
.spotcard .mk { width: 34px; height: 34px; font-size: 16px; }
.spotcard .body { min-width: 0; flex: 1; }
.spotcard .body b { display: block; font-size: 15px; }
.spotcard .body small { color: var(--muted); font-size: 11px; font-family: var(--font-m); word-break: break-all; }
.spotcard .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 0 4px; align-self: flex-start; }

/* SVG */
.pref { stroke: var(--border); stroke-width: .6; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .4s; }
.pref:hover { stroke: var(--ink); stroke-width: 1.4; }
.pref.ctx { fill: var(--land-dim); cursor: pointer; }
.pref.sel { fill: var(--land); stroke: none; cursor: default; }
.outline { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.lv0 { fill: var(--land); } .lv1 { fill: var(--lv1); } .lv2 { fill: var(--lv2); } .lv3 { fill: var(--lv3); } .lv4 { fill: var(--lv4); }
.cell { fill: transparent; stroke: var(--border); stroke-opacity: .45; stroke-width: .5; vector-effect: non-scaling-stroke; }
.cell.t { fill: var(--target); stroke: var(--accent); stroke-opacity: .7; stroke-dasharray: 3 2; cursor: pointer; }
.cell.f { fill: var(--lv3); stroke: var(--lv3); stroke-dasharray: none; stroke-opacity: 1; cursor: pointer; }
.cell.f.all { fill: var(--lv4); stroke: var(--lv4); }
.cell.on { stroke: var(--ink); stroke-width: 2; stroke-opacity: 1; stroke-dasharray: none; }
.cell.pop { animation: pop .9s ease-out; }
@keyframes pop { 0% { fill: var(--lv4); filter: brightness(1.5); } 100% { } }
.m1 { fill: transparent; stroke: var(--border); stroke-opacity: .55; stroke-width: .5; vector-effect: non-scaling-stroke; pointer-events: none; }
.m1.t { fill: var(--target); fill-opacity: .9; }
.m1.lv1 { fill: var(--lv1); } .m1.lv2 { fill: var(--lv2); } .m1.lv3 { fill: var(--lv3); } .m1.lv4 { fill: var(--lv4); }
.inset { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.insetlabel { font-size: 11px; fill: var(--muted); }
.marker { cursor: pointer; }
.marker circle { stroke: var(--c); stroke-width: 2.2; fill: var(--panel); }
.marker text { font-size: 11px; font-weight: 700; fill: var(--c); text-anchor: middle; dominant-baseline: central; pointer-events: none; font-family: var(--font-b); }
.marker.v circle { fill: var(--c); stroke: var(--panel); }
.marker.v text { fill: var(--marker-ink); }
.marker.sel circle { stroke: var(--ink); stroke-width: 3; }

/* ---- panel content ---- */
.sec h2 { font-size: 12px; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.ph { display: flex; flex-direction: column; gap: 8px; }
.ph h1 { font-family: var(--font-d); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill { font-family: var(--font-b); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); }
.pill.lv1 { background: var(--lv1); border-color: transparent; } .pill.lv2 { background: var(--lv2); border-color: transparent; }
.pill.lv3 { background: var(--lv3); color: #fff; border-color: transparent; } .pill.lv4 { background: var(--lv4); color: #2A1F00; border-color: transparent; }
.pill.lv0 { background: transparent; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kv div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.kv b { font-family: var(--font-d); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.kv span { color: var(--muted); font-size: 12px; margin-left: 2px; }
.kv small { display: block; color: var(--muted); font-size: 11px; }
.bars { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.2em; gap: 10px; align-items: center; font-size: 13px; }
.bars .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.track { height: 8px; border-radius: 4px; background: var(--land-dim); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--lv3); border-radius: 4px; transition: width .5s; }
.track i.full { background: var(--lv4); }
.bars .lab { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .lab .mk { width: 18px; height: 18px; font-size: 10px; }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.badge { border: 1px dashed var(--border); border-radius: 10px; padding: 8px; text-align: center; color: var(--muted); }
.badge b { display: block; font-size: 12px; }
.badge small { font-size: 10.5px; line-height: 1.4; display: block; }
.badge.got { border: 1px solid var(--lv4); background: color-mix(in srgb, var(--lv4) 16%, var(--panel)); color: var(--ink); }
.badge .seal { font-family: var(--font-d); font-size: 18px; display: block; color: var(--border); }
.badge.got .seal { color: var(--lv4); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; }
.row:hover { background: var(--land-dim); }
.row.flash { animation: flash 1.2s; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--lv4) 40%, transparent); } }
.row .nm { min-width: 0; flex: 1; cursor: pointer; }
.row .nm b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { color: var(--muted); font-size: 11px; font-family: var(--font-m); }
.go { flex: none; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 7px; padding: 3px 12px; font-size: 12px; font-weight: 700; }
.go.done { background: var(--accent); color: var(--on-accent); }
.go.big { padding: 8px 16px; font-size: 14px; }
.grp { font-size: 12px; color: var(--muted); margin: 12px 0 4px; display: flex; align-items: center; gap: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.filterbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; background: var(--target); border-radius: 8px; padding: 6px 10px; }
.filterbar button { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 12px; }
.odpt { display: grid; gap: 8px; }
.odpt textarea { width: 100%; box-sizing: border-box; min-height: 64px; font-family: var(--font-m); font-size: 11px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.odpt code { font-family: var(--font-m); font-size: 11px; background: var(--land-dim); padding: 6px 8px; border-radius: 6px; display: block; overflow-x: auto; white-space: nowrap; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 7px; padding: 4px 12px; font-size: 12px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.recent .nm small { font-family: var(--font-b); }

.toasts { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 10; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgb(0 0 0 / .25); animation: tin .35s ease-out; }
.toast b { color: var(--lv4); font-family: var(--font-d); font-weight: 400; margin-right: 6px; }
@keyframes tin { from { transform: translateY(12px); opacity: 0; } }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 62svh; min-height: 360px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .stats { margin-left: 0; gap: 18px; }
  .stat b { font-size: 22px; }
  .demo { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo">ぬりたび</span><span class="tagline">行った場所で、日本を塗りつぶす</span></div>
    <div class="stats">
      <div class="stat"><b id="st-pref">0</b><span>/47</span><small>都道府県</small></div>
      <div class="stat"><b id="st-mesh">0</b><span id="st-mesh-t">/0</span><small>10kmメッシュ</small></div>
      <div class="stat"><b id="st-spot">0</b><span id="st-spot-t">/0</span><small>スポット</small></div>
    </div>
  </header>
  <div class="strip">
    <div class="chips" id="chips" role="group" aria-label="表示するカテゴリ"></div>
    <div class="demo" id="demo" hidden><span>デモ用の旅の記録が入っています</span><button id="demo-clear" type="button">記録を消して自分の旅をはじめる</button></div>
  </div>
  <main class="main">
    <section class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="塗りつぶし地図"></svg>
      <button class="backbtn" id="back" type="button" hidden>← 全国</button>
      <div class="maptools">
        <div class="seg" id="seg-over">
          <button type="button" data-v="pref" aria-pressed="true">都道府県</button>
          <button type="button" data-v="m1" aria-pressed="false">80kmメッシュ</button>
        </div>
        <div class="seg" id="seg-detail" hidden>
          <button type="button" data-v="m2" aria-pressed="true">10km</button>
          <button type="button" data-v="m3" aria-pressed="false">1km</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="attr">地図：<a href="https://www.gsi.go.jp/kankyochiri/gm_jpn.html" target="_blank" rel="noopener">地球地図日本</a></div>
      <div class="tip" id="tip" hidden></div>
      <div class="spotcard" id="spotcard" hidden></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

const ratioLv = (f, t) => !f ? 0 : f >= t ? 4 : f / t >= 2/3 ? 3 : f / t >= 1/3 ? 2 : 1;

const BADGES = [
  ["はじめの一歩", "1か所チェックイン", T => T.spots >= 1],
  ["湯めぐり", "温泉 5か所", T => T.c.onsen >= 5],
  ["湯けむり名人", "温泉 15か所", T => T.c.onsen >= 15],
  ["道の駅スタンプ帳", "道の駅 10か所", T => T.c.michi >= 10],
  ["絶叫ハンター", "遊園地 5か所", T => T.c.park >= 5],
  ["乗り鉄", "駅 10か所", T => T.c.eki >= 10],
  ["10県突破", "10都道府県に足あと", T => T.prefs >= 10],
  ["日本の半分", "24都道府県に足あと", T => T.prefs >= 24],
  ["全国制覇", "47都道府県すべて", T => T.prefs >= 47],
  ["みちのく一周", "東北6県に足あと", T => [2,3,4,5,6,7].every(i => T.pset.has(i))],
  ["お遍路気分", "四国4県に足あと", T => [36,37,38,39].every(i => T.pset.has(i))],
  ["九州・沖縄縦断", "九州・沖縄8県に足あと", T => [40,41,42,43,44,45,46,47].every(i => T.pset.has(i))],
  ["塗り職人", "10kmメッシュを30区画", T => T.mesh >= 30],
  ["県を塗りきる", "どこか1県を制覇", T => T.complete >= 1],
  ["路線を乗りつぶす", "取り込んだ路線を1本完乗", T => T.lineDone >= 1],
];
function totals() { // 実績はカテゴリの絞り込みに関係なく全データで判定
  const T0 = tally(ALL);
  const c = {}; Object.keys(CATS).forEach(k => c[k] = T0.cat[k]?.v || 0);
  const pset = new Set(Object.keys(T0.pref).filter(id => T0.pref[id].v).map(Number));
  let mesh = 0, complete = 0;
  for (const id in T0.pref) { mesh += T0.pref[id].f.size; if (T0.lv(id) === 4) complete++; }
  const lineDone = lineStats().filter(l => l.v === l.n).length;
  const spots = ALL.filter(s => state.visits[s.id]).length;
  const T = { c, pset, prefs: pset.size, mesh, complete, lineDone, spots };
  T.badges = new Set(BADGES.filter(b => b[2](T)).map(b => b[0]));
  T.complSet = new Set(Object.keys(T0.pref).filter(id => T0.lv(id) === 4));
  T.meshSet = new Set(ALL.filter(s => state.visits[s.id]).map(s => s.m2));
  return T;
}
function lineStats() { // 取り込んだ路線ごとの乗りつぶし状況
  const by = {};
  ALL.filter(s => s.cat === "eki" && (s.src === "odpt" || s.inImport)).forEach(s => s.lines.forEach(l => { (by[l] ||= { n: 0, v: 0 }).n++; if (state.visits[s.id]) by[l].v++; }));
  return Object.entries(by).map(([l, o]) => ({ l, ...o })).sort((a, b) => b.v / b.n - a.v / a.n || b.n - a.n);
}

/* ================= 地図描画 ================= */
const svg = d3.select("#map"), wrap = document.getElementById("mapwrap");
const gz = svg.append("g");
let W = 0, H = 0, K = 1, markerSel = null;
const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", e => {
  gz.attr("transform", e.transform); K = e.transform.k;
  if (markerSel) markerSel.attr("transform", d => `translate(${d.x},${d.y}) scale(${1 / Math.sqrt(K)})`);
});
svg.call(zoom).on("dblclick.zoom", null);
const tip = document.getElementById("tip");
function showTip(ev, html) {
  const r = wrap.getBoundingClientRect();
  tip.innerHTML = html; tip.hidden = false;
  const x = Math.min(ev.clientX - r.left + 14, r.width - tip.offsetWidth - 8), y = Math.min(ev.clientY - r.top + 14, r.height - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rectOf(proj, code) {
  const [x0, y0, x1, y1] = meshBox(code), a = proj([x0, y1]), b = proj([x1, y0]);
  return { x: a[0], y: a[1], w: b[0] - a[0], h: b[1] - a[1] };
}

function drawMap() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  gz.selectAll("*").remove(); markerSel = null; hideTip();
  svg.call(zoom.transform, d3.zoomIdentity); K = 1;
  ui.view === "over" ? drawOverview() : drawDetail();
  drawLegend();
}

function drawOverview() {
  const T = tally(active());
  const pad = 16;
  const main = d3.geoMercator().fitExtent([[pad, pad + 30], [W - pad, H - pad - 40]], { type: "MultiPoint", coordinates: [[128.6, 30.2], [146.0, 45.6]] });
  const iw = Math.max(110, Math.min(W * 0.3, 230)), ih = iw * 0.75;
  const ibox = [[pad + 6, pad + 40], [pad + iw, pad + 40 + ih]];
  const inset = d3.geoMercator().fitExtent([[ibox[0][0] + 8, ibox[0][1] + 18], [ibox[1][0] - 8, ibox[1][1] - 8]], PREF[47].f);
  const pathM = d3.geoPath(main), pathI = d3.geoPath(inset);

  gz.append("rect").attr("class", "inset").attr("x", ibox[0][0]).attr("y", ibox[0][1]).attr("width", iw - 6).attr("height", ih).attr("rx", 6);
  gz.append("text").attr("class", "insetlabel").attr("x", ibox[0][0] + 8).attr("y", ibox[0][1] + 14).text("沖縄県");

  const prefs = FEATURES.map(f => ({ f, id: f.properties.id }));
  gz.append("g").selectAll("path").data(prefs).join("path")
    .attr("class", d => `pref lv${ui.overMode === "pref" ? T.lv(d.id) : 0}`)
    .attr("d", d => (d.id === 47 ? pathI : pathM)(d.f))
    .on("mousemove", (ev, d) => { const P = T.pref[d.id]; showTip(ev, `<b>${PREF[d.id].name}</b>${LV_NAME[T.lv(d.id)]}・メッシュ ${P.f.size}/${P.t.size}・スポット ${P.v}/${P.n}`); })
    .on("mouseleave", hideTip)
    .on("click", (ev, d) => openPref(d.id));

  if (ui.overMode === "m1") {
    const cells = Object.keys(M1_OF_PREF).map(c => ({ c, ok: M1_OF_PREF[c].has(47) && M1_OF_PREF[c].size === 1 }));
    gz.append("g").selectAll("rect").data(cells).join("rect")
      .attr("class", d => { const m = T.m1[d.c]; return "m1 " + (m ? (m.f.size ? "lv" + ratioLv(m.f.size, m.all.size) : "t") : ""); })
      .each(function (d) { const r = rectOf(d.ok ? inset : main, d.c); d3.select(this).attr("x", r.x).attr("y", r.y).attr("width", r.w).attr("height", r.h); });
  }
}

function drawDetail() {
  const P = PREF[ui.pref], list = active().filter(s => s.pref === ui.pref), T = tally(active()), TP = T.pref[ui.pref];
  const fitObj = { type: "FeatureCollection", features: [{ type: "Feature", geometry: P.main }, ...list.map(s => ({ type: "Feature", geometry: { type: "Point", coordinates: [s.lon, s.lat] } }))] };
  const proj = d3.geoMercator().fitExtent([[24, 56], [W - 24, H - 60]], fitObj);
  const path = d3.geoPath(proj);
  const clipId = "clip" + ui.pref;
  gz.append("defs").append("clipPath").attr("id", clipId).append("path").attr("d", path(P.f));
  gz.append("g").selectAll("path").data(FEATURES.filter(f => f.properties.id !== ui.pref)).join("path")
    .attr("class", "pref ctx").attr("d", path)
    .on("mousemove", (ev, f) => showTip(ev, `<b>${f.properties.nam_ja}</b>クリックで移動`)).on("mouseleave", hideTip)
    .on("click", (ev, f) => openPref(f.properties.id));
  gz.append("path").attr("class", "pref sel").attr("d", path(P.f));

  const byMesh = d3.group(list, s => ui.detailMode === "m2" ? s.m2 : s.m3);
  const g = gz.append("g").attr("clip-path", `url(#${clipId})`);
  // 10km の格子は常に下地として描く
  g.append("g").selectAll("rect").data(P.m2).join("rect").attr("class", "cell")
    .each(function (c) { const r = rectOf(proj, c); d3.select(this).attr("x", r.x).attr("y", r.y).attr("width", r.w).attr("height", r.h); })
    .style("pointer-events", "none");
  const targets = [...byMesh.keys()];
  g.append("g").selectAll("rect").data(targets).join("rect")
    .attr("data-code", c => c)
    .attr("class", c => { const ss = byMesh.get(c), v = ss.filter(s => state.visits[s.id]).length; return `cell t${v ? " f" : ""}${v && v === ss.length && ss.length > 1 ? " all" : ""}${ui.mesh === c ? " on" : ""}`; })
    .each(function (c) { const r = rectOf(proj, c); d3.select(this).attr("x", r.x).attr("y", r.y).attr("width", r.w).attr("height", r.h); })
    .on("mousemove", (ev, c) => { const ss = byMesh.get(c); showTip(ev, `<b>メッシュ ${fmtMesh(c)}</b>${ss.map(s => (state.visits[s.id] ? "● " : "○ ") + esc(s.name)).join("<br>")}`); })
    .on("mouseleave", hideTip)
    .on("click", (ev, c) => { ui.mesh = ui.mesh === c ? null : c; ui.spot = null; render(); });
  gz.append("path").attr("class", "outline").attr("d", path(P.f));

  const pts = list.map(s => { const [x, y] = proj([s.lon, s.lat]); return { s, x, y }; })
    .sort((a, b) => !!state.visits[a.s.id] - !!state.visits[b.s.id]);
  markerSel = gz.append("g").selectAll("g").data(pts).join("g")
    .attr("class", d => `marker cat-${d.s.cat}${state.visits[d.s.id] ? " v" : ""}${ui.spot === d.s.id ? " sel" : ""}`)
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .on("mousemove", (ev, d) => showTip(ev, `<b>${esc(d.s.name)}</b>${CATS[d.s.cat].label}・${state.visits[d.s.id] ? "行った " + state.visits[d.s.id] : "まだ"}`))
    .on("mouseleave", hideTip)
    .on("click", (ev, d) => { ev.stopPropagation(); ui.spot = d.s.id; render(); });
  markerSel.append("circle").attr("r", 11);
  markerSel.append("text").text(d => CATS[d.s.cat].mk);
}

function drawLegend() {
  const L = document.getElementById("legend");
  if (ui.view === "over" && ui.overMode === "pref") {
    L.innerHTML = [1, 2, 3, 4].map(l => `<span><i style="background:var(--lv${l})"></i>${LV_NAME[l]}</span>`).join("") + `<span>（スポットのある10kmメッシュを何割塗ったか）</span>`;
  } else if (ui.view === "over") {
    L.innerHTML = `<span><i style="background:var(--target)"></i>塗れる場所あり</span>` + [1, 2, 3, 4].map(l => `<span><i style="background:var(--lv${l})"></i>${LV_NAME[l]}</span>`).join("");
  } else {
    L.innerHTML = `<span><i style="background:var(--target);border:1px dashed var(--accent)"></i>まだ塗れる</span><span><i style="background:var(--lv3)"></i>塗った</span><span><i style="background:var(--lv4)"></i>区画内を全部制覇</span>`;
  }
}

/* ================= パネル ================= */
const panel = document.getElementById("panel");
function bar(label, v, n, extra = "") {
  const pct = n ? Math.round(v / n * 100) : 0;
  return `<li><span class="lab">${extra}${label}</span><span class="track"><i class="${n && v >= n ? "full" : ""}" style="width:${pct}%"></i></span><span class="num">${v}/${n}</span></li>`;
}
function renderOverviewPanel() {
  const T = tally(active()), TT = totals();
  const regions = REGIONS.map(([name, ids]) => bar(name, ids.filter(i => T.pref[i].v).length, ids.length)).join("");
  const cats = Object.entries(CATS).map(([k, c]) => { const t = tally(ALL).cat[k] || { n: 0, v: 0 }; return t.n ? bar(c.label, t.v, t.n, `<span class="mk cat-${k}">${c.mk}</span>`) : ""; }).join("");
  const badges = BADGES.map(([n, d]) => `<div class="badge${TT.badges.has(n) ? " got" : ""}"><span class="seal">${TT.badges.has(n) ? "印" : "・"}</span><b>${n}</b><small>${d}</small></div>`).join("");
  const recent = ALL.filter(s => state.visits[s.id]).sort((a, b) => state.visits[b.id].localeCompare(state.visits[a.id])).slice(0, 6)
    .map(s => `<li class="row recent"><span class="mk cat-${s.cat}">${CATS[s.cat].mk}</span><div class="nm" data-pref="${s.pref}" data-spot="${esc(s.id)}"><b>${esc(s.name)}</b><small>${PREF[s.pref].name}・${state.visits[s.id]}</small></div></li>`).join("");
  const lines = lineStats();
  const nImp = state.imported.length;
  panel.innerHTML = `
    <div class="sec"><h2>地方ごとの足あと</h2><ul class="bars">${regions}</ul></div>
    <div class="sec"><h2>カテゴリ別</h2><ul class="bars">${cats}</ul></div>
    <div class="sec"><h2>実績 ${TT.badges.size}/${BADGES.length}</h2><div class="badges">${badges}</div></div>
    <div class="sec"><h2>最近のチェックイン</h2>${recent ? `<ul class="list">${recent}</ul>` : `<p class="note">まだありません。地図の県をクリックして、行ったスポットに「行った！」を付けてみてください。</p>`}</div>
    <div class="sec odpt"><h2>交通データ（ODPT）</h2>
      <p class="note">公共交通オープンデータセンターの <b>odpt:Station</b>（駅）や <b>odpt:BusstopPole</b>（バス停）のJSONを読み込むと、駅やバス停が塗れる場所として追加されます。取得にはご自身のアクセストークンが必要です。</p>
      <code>https://api.odpt.org/api/v4/odpt:Station?odpt:operator=odpt.Operator:TokyoMetro&amp;acl:consumerKey=（あなたのキー）</code>
      <div class="btns">
        <button class="btn pri" type="button" id="odpt-sample">銀座線サンプルで試す</button>
        <label class="btn file">JSONファイルを選ぶ<input type="file" id="odpt-file" accept=".json,application/json"></label>
        ${nImp ? `<button class="btn" type="button" id="odpt-clear">取り込みを消す（${nImp}件）</button>` : ""}
      </div>
      <textarea id="odpt-text" placeholder="ここにJSONを貼り付けて「読み込む」"></textarea>
      <div class="btns"><button class="btn" type="button" id="odpt-load">貼り付けたJSONを読み込む</button></div>
      ${lines.length ? `<h2 style="margin-top:8px">路線の乗りつぶし</h2><ul class="bars">${lines.slice(0, 12).map(l => bar(esc(l.l), l.v, l.n)).join("")}</ul>` : ""}
    </div>
    <div class="sec"><h2>出典</h2>
      <p class="note">地図：<a href="https://www.gsi.go.jp/kankyochiri/gm_jpn.html" target="_blank" rel="noopener">地球地図日本</a>（国土地理院）を <a href="https://github.com/dataofjapan/land" target="_blank" rel="noopener">dataofjapan/land</a> が TopoJSON に変換したもの。<br>
      スポット・駅：試作用に手で選んだサンプルで、座標は概略値です。銀座線サンプルは ODPT の形式に合わせて作ったもので、ODPT から取得したデータではありません。</p></div>`;
  panel.querySelectorAll("[data-pref]").forEach(el => el.onclick = () => { ui.spot = el.dataset.spot; openPref(+el.dataset.pref, true); });
  document.getElementById("odpt-sample").onclick = () => importOdpt(ODPT_SAMPLE);
  document.getElementById("odpt-file").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { importOdpt(JSON.parse(await f.text())); } catch (err) { toast("JSONとして読めませんでした。ファイルの中身を確認してください。"); } };
  document.getElementById("odpt-load").onclick = () => { try { importOdpt(JSON.parse(document.getElementById("odpt-text").value)); } catch (err) { toast("JSONとして読めませんでした。貼り付けた内容を確認してください。"); } };
  const c = document.getElementById("odpt-clear"); if (c) c.onclick = () => { state.imported = []; save(); rebuild(); render(); toast("取り込んだ交通データを消しました"); };
}

function renderDetailPanel() {
  const P = PREF[ui.pref], T = tally(active()), TP = T.pref[ui.pref], lv = T.lv(ui.pref);
  let list = active().filter(s => s.pref === ui.pref);
  const key = ui.detailMode === "m2" ? "m2" : "m3";
  const filtered = ui.mesh ? list.filter(s => s[key] === ui.mesh) : list;
  const groups = Object.keys(CATS).map(k => [k, filtered.filter(s => s.cat === k)]).filter(([, a]) => a.length);
  panel.innerHTML = `
    <div class="ph"><h1>${P.name}<span class="pill lv${lv}">${LV_NAME[lv]}</span></h1>
      <div class="kv">
        <div><small>塗った10kmメッシュ</small><b>${TP.f.size}</b><span>/ ${TP.t.size}</span></div>
        <div><small>行ったスポット</small><b>${TP.v}</b><span>/ ${TP.n}</span></div>
        <div><small>1kmメッシュ</small><b>${TP.f3.size}</b><span>/ ${TP.t3.size}</span></div>
        <div><small>県内の10kmメッシュ</small><b>${P.m2.length}</b><span>区画</span></div>
      </div>
    </div>
    ${ui.mesh ? `<div class="filterbar"><span>メッシュ ${fmtMesh(ui.mesh)} のスポット</span><button type="button" id="mesh-clear">すべて表示</button></div>` : ""}
    <div class="sec">${groups.length ? groups.map(([k, a]) => `<div class="grp"><span class="mk cat-${k}">${CATS[k].mk}</span>${CATS[k].label}（${a.filter(s => state.visits[s.id]).length}/${a.length}）</div>
      <ul class="list">${a.map(s => `<li class="row" data-id="${esc(s.id)}"><span class="mk cat-${s.cat}${state.visits[s.id] ? "" : " off"}">${CATS[s.cat].mk}</span>
        <div class="nm" data-focus="${esc(s.id)}"><b>${esc(s.name)}</b><small>${fmtMesh(s.m2)}${s.lines.length ? "・" + esc(s.lines.join(", ")) : ""}${state.visits[s.id] ? "・" + state.visits[s.id] : ""}</small></div>
        <button type="button" class="go${state.visits[s.id] ? " done" : ""}" data-go="${esc(s.id)}">${state.visits[s.id] ? "行った" : "行った！"}</button></li>`).join("")}</ul>`).join("")
      : `<p class="note">表示中のカテゴリにはスポットがありません。上のカテゴリを切り替えてみてください。</p>`}</div>
    <p class="note">「行った」をもう一度押すと取り消せます。</p>`;
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => toggleVisit(b.dataset.go));
  panel.querySelectorAll("[data-focus]").forEach(el => el.onclick = () => { ui.spot = el.dataset.focus; render(); });
  const mc = document.getElementById("mesh-clear"); if (mc) mc.onclick = () => { ui.mesh = null; render(); };
}

function renderSpotCard() {
  const el = document.getElementById("spotcard");
  const s = ui.view === "detail" && ui.spot && ALL.find(x => x.id === ui.spot);
  if (!s) { el.hidden = true; return; }
  const v = state.visits[s.id];
  el.hidden = false;
  el.innerHTML = `<span class="mk cat-${s.cat}${v ? "" : " off"}">${CATS[s.cat].mk}</span>
    <div class="body"><b>${esc(s.name)}</b><small>${CATS[s.cat].label}・10km ${fmtMesh(s.m2)}・1km ${fmtMesh(s.m3)}${s.odpt ? "<br>" + esc(s.odpt) : ""}</small></div>
    <button type="button" class="go big${v ? " done" : ""}" id="card-go">${v ? "行った " + v.slice(5).replace("-", "/") : "行った！"}</button>
    <button type="button" class="x" id="card-x" aria-label="閉じる">×</button>`;
  document.getElementById("card-go").onclick = () => toggleVisit(s.id);
  document.getElementById("card-x").onclick = () => { ui.spot = null; render(); };
}

function renderHeader() {
  const T = tally(active());
  let pf = 0, mf = 0, mt = 0, sv = 0, sn = 0;
  for (const id in T.pref) { const P = T.pref[id]; if (P.v) pf++; mf += P.f.size; mt += P.t.size; sv += P.v; sn += P.n; }
  document.getElementById("st-pref").textContent = pf;
  document.getElementById("st-mesh").textContent = mf; document.getElementById("st-mesh-t").textContent = "/" + mt;
  document.getElementById("st-spot").textContent = sv; document.getElementById("st-spot-t").textContent = "/" + sn;
  document.getElementById("demo").hidden = !state.demo;
  document.getElementById("chips").innerHTML = Object.entries(CATS).map(([k, c]) =>
    `<button type="button" class="chip" data-cat="${k}" aria-pressed="${state.cats.includes(k)}"><span class="mk cat-${k}">${c.mk}</span>${c.label}</button>`).join("");
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    const k = b.dataset.cat; state.cats = state.cats.includes(k) ? state.cats.filter(x => x !== k) : [...state.cats, k];
    if (!state.cats.length) state.cats = [k];
    save(); render();
  });
  document.getElementById("back").hidden = ui.view !== "detail";
  document.getElementById("seg-over").hidden = ui.view !== "over";
  document.getElementById("seg-detail").hidden = ui.view !== "detail";
  document.querySelectorAll("#seg-over button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === ui.overMode));
  document.querySelectorAll("#seg-detail button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === ui.detailMode));
}

function render(opts = {}) {
  renderHeader();
  if (opts.keepMap) {
    // 地図は作り直さず、塗り・マーカーのみ更新したいが簡潔さを優先して再描画（ズームは保持）
    const t = d3.zoomTransform(svg.node());
    drawMap(); svg.call(zoom.transform, t);
  } else drawMap();
  ui.view === "over" ? renderOverviewPanel() : renderDetailPanel();
  renderSpotCard();
}

/* ================= 操作 ================= */
function openPref(id, focusSpot) {
  ui.view = "detail"; ui.pref = id; ui.mesh = null; if (!focusSpot) ui.spot = null;
  render();
  if (focusSpot) flashRow(ui.spot);
}
function flashRow(id) {
  const row = [...panel.querySelectorAll(".row")].find(r => r.dataset.id === id);
  if (row) { row.scrollIntoView({ block: "nearest", behavior: "smooth" }); row.classList.add("flash"); }
}
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function toggleVisit(id) {
  const s = ALL.find(x => x.id === id); if (!s) return;
  const before = totals();
  if (state.visits[id]) { delete state.visits[id]; save(); render({ keepMap: true }); return; }
  state.visits[id] = today(); save();
  const after = totals();
  const msgs = [];
  if (!before.pset.has(s.pref)) msgs.push(`<b>初上陸</b>${PREF[s.pref].name}に足あとを付けました`);
  if (!before.meshSet.has(s.m2)) msgs.push(`<b>塗った</b>メッシュ ${fmtMesh(s.m2)}`);
  if (!before.complSet.has(String(s.pref)) && after.complSet.has(String(s.pref))) msgs.push(`<b>制覇</b>${PREF[s.pref].name}をすべて塗りました`);
  after.badges.forEach(b => { if (!before.badges.has(b)) msgs.push(`<b>実績</b>${b}`); });
  if (!msgs.length) msgs.push(`<b>チェックイン</b>${esc(s.name)}`);
  render({ keepMap: true });
  const cell = gz.select(`[data-code="${ui.detailMode === "m2" ? s.m2 : s.m3}"]`).node();
  if (cell) { cell.classList.remove("pop"); void cell.getBBox(); cell.classList.add("pop"); }
  msgs.forEach((m, i) => setTimeout(() => toast(m, true), i * 350));
}

const toasts = document.getElementById("toasts");
function toast(html, raw) {
  const d = document.createElement("div"); d.className = "toast"; d[raw ? "innerHTML" : "textContent"] = html;
  toasts.appendChild(d); setTimeout(() => d.remove(), 3200);
}

function importOdpt(json) {
  const arr = Array.isArray(json) ? json : [json];
  let added = 0, skipped = 0;
  const known = new Map(state.imported.map(o => [o.id, o]));
  for (const it of arr) {
    const type = it["@type"], lat = +it["geo:lat"], lon = +it["geo:long"];
    if (!(type === "odpt:Station" || type === "odpt:BusstopPole") || !isFinite(lat) || !isFinite(lon)) { skipped++; continue; }
    const pref = prefAt(lon, lat);
    if (!pref) { skipped++; continue; }
    const id = it["owl:sameAs"] || `${it["dc:title"]}@${lat},${lon}`;
    const name = (it["dc:title"] || it["odpt:stationTitle"]?.ja || id) + (type === "odpt:Station" ? "駅" : "");
    const lines = type === "odpt:Station" && it["odpt:railway"] ? [String(it["odpt:railway"]).replace(/^odpt\.Railway:/, "")] : [];
    if (known.has(id)) { const o = known.get(id); o.lines = [...new Set([...o.lines, ...lines])]; continue; }
    const o = { id, name, cat: type === "odpt:Station" ? "eki" : "bus", pref, lat, lon, lines, odpt: it["owl:sameAs"] || null, src: "odpt" };
    state.imported.push(o); known.set(id, o); added++;
  }
  if (!state.cats.includes("eki")) state.cats.push("eki");
  if (!state.cats.includes("bus") && arr.some(i => i["@type"] === "odpt:BusstopPole")) state.cats.push("bus");
  save(); rebuild(); render();
  toast(added ? `${added}件の駅・バス停を追加しました${skipped ? `（${skipped}件は位置情報がないなどで除外）` : ""}` : `新しく追加できるデータはありませんでした${skipped ? `（${skipped}件を除外）` : ""}`);
}

document.getElementById("back").onclick = () => { ui.view = "over"; ui.pref = null; ui.mesh = null; ui.spot = null; render(); };
document.querySelectorAll("#seg-over button").forEach(b => b.onclick = () => { ui.overMode = b.dataset.v; render(); });
document.querySelectorAll("#seg-detail button").forEach(b => b.onclick = () => { ui.detailMode = b.dataset.v; ui.mesh = null; render(); });
document.getElementById("demo-clear").onclick = () => { state = { visits: {}, demo: false, imported: state.imported, cats: state.cats }; save(); render(); toast("記録を消しました。最初の一か所を塗りに行きましょう"); };
svg.on("click", ev => { if (ev.target === svg.node() && ui.spot) { ui.spot = null; render({ keepMap: true }); } });

let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { if (wrap.clientWidth !== W || wrap.clientHeight !== H) render({ keepMap: true }); }, 120); }).observe(wrap);
render();
</script>
